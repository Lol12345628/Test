<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm FULL CONTROL</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,160px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:18px;
  border-radius:12px;
}

.value{
  font-size:26px;
  font-weight:bold;
}

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  width:150px;
}

.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }
.auto{ background:#a855f7; color:white; }
.connect{ background:#3b82f6; color:white; }

</style>
</head>

<body>

<h2>🤖 Smart Farm CONTROL</h2>

<button class="connect" onclick="connectUSB()">Connect</button>
<button class="auto" onclick="toggleAuto()">AUTO</button>

<br>

<button id="pump" class="off" onclick="send('pump_on')">Pump</button>
<button id="light" class="off" onclick="send('light_on')">Light</button>
<button id="fan" class="off" onclick="send('fan_on')">Fan</button>

<div class="grid">
  <div class="card">🌡 <div id="t">-</div></div>
  <div class="card">💧 <div id="h">-</div></div>
  <div class="card">🌱 <div id="s">-</div></div>
  <div class="card">💡 <div id="l">-</div></div>
</div>

<script>

let port, writer;

async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();
  readLoop();
}

async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

function toggleAuto(){
  send("auto_on");
}

async function readLoop(){

  const r = port.readable.getReader();
  let buffer="";

  while(true){

    const {value} = await r.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let d = line.split(",");
      if(d.length!=4) continue;

      document.getElementById("t").innerText = d[0];
      document.getElementById("h").innerText = d[1];
      document.getElementById("s").innerText = d[2];
      document.getElementById("l").innerText = d[3];
    }
  }
}

</script>

</body>
</html>
