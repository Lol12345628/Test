<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm Stable FINAL</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,160px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:18px;
  border-radius:16px;
}

.value{
  font-size:26px;
  font-weight:bold;
}

.temp{ color:#f87171; }
.hum{ color:#38bdf8; }
.soil{ color:#22c55e; }
.lux{ color:#facc15; }

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:150px;
}

.connect{ background:#3b82f6; color:white; }
.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }
.auto{ background:#a855f7; color:white; }

.aiBox{
  margin-top:15px;
  padding:10px;
  background:#1e293b;
  border-radius:10px;
  display:inline-block;
  min-width:300px;
}

</style>
</head>

<body>

<h2>🤖 Smart Farm FINAL STABLE</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect</button>
<button class="auto" onclick="toggleAuto()">AUTO: OFF</button>

<br>

<button id="pumpBtn" class="off" onclick="manual('pump')">Pump OFF</button>
<button id="lightBtn" class="off" onclick="manual('light')">Light OFF</button>
<button id="fanBtn" class="off" onclick="manual('fan')">Fan OFF</button>

<!-- SENSOR -->
<div class="grid">

  <div class="card">🌡 <div id="temp" class="value temp">-</div></div>
  <div class="card">💧 <div id="hum" class="value hum">-</div></div>
  <div class="card">🌱 <div id="soil" class="value soil">-</div></div>
  <div class="card">💡 <div id="lux" class="value lux">-</div></div>

</div>

<div class="aiBox" id="aiText">AI: standby</div>

<script>

let port, writer;
let autoMode = false;
let busy = false; // 🔥 กันค้าง

// ================= CONNECT =================
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });

  writer = port.writable.getWriter();

  readLoop();
}

// ================= SAFE SEND =================
async function send(cmd){

  if(!writer || busy) return;

  busy = true;

  try{
    await writer.write(new TextEncoder().encode(cmd + "\n"));
  }catch(e){
    console.log("send error",e);
  }

  busy = false;
}

// ================= AUTO =================
function toggleAuto(){

  autoMode = !autoMode;

  document.querySelector(".auto").innerText =
    autoMode ? "AUTO: ON" : "AUTO: OFF";

  send(autoMode ? "auto_on" : "auto_off");
}

// ================= MANUAL =================
function manual(dev){

  if(autoMode){
    alert("ปิด AUTO ก่อน");
    return;
  }

  send(dev + "_on");

  if(dev==="pump") pumpBtn.className="on";
  if(dev==="light") lightBtn.className="on";
  if(dev==="fan") fanBtn.className="on";
}

// ================= AI DISPLAY ONLY =================
function AI(temp, hum, soil, lux){

  if(!autoMode) return;

  let msg = "AI: Normal 🌿";

  if(soil < 30) msg = "AI: Soil Dry → Pump ON 💧";
  else if(temp > 35) msg = "AI: Hot → Fan ON 🌬";
  else if(lux < 100) msg = "AI: Dark → Light ON 💡";

  document.getElementById("aiText").innerText = msg;
}

// ================= READ SENSOR (NO FREEZE) =================
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  const tempEl = document.getElementById("temp");
  const humEl  = document.getElementById("hum");
  const soilEl = document.getElementById("soil");
  const luxEl  = document.getElementById("lux");

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let i=0;i<lines.length;i++){

      let d = lines[i].trim().split(",");
      if(d.length !== 4) continue;

      let t = +d[0];
      let h = +d[1];
      let s = +d[2];
      let l = +d[3];

      tempEl.innerText = t.toFixed(1);
      humEl.innerText  = h.toFixed(1);
      soilEl.innerText = s;
      luxEl.innerText  = l.toFixed(0);

      AI(t,h,s,l);
    }
  }
}

</script>

</body>
</html>
