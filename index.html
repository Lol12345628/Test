<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Farm</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌱 Smart Farm Dashboard</h1>

<div class="grid">
  <div class="card">🌡 Temp <h2 id="temp">-</h2></div>
  <div class="card">💧 Hum <h2 id="hum">-</h2></div>
  <div class="card">🌱 Soil <h2 id="soil">-</h2></div>
  <div class="card">💡 Lux <h2 id="lux">-</h2></div>
</div>

<div class="controls">
  <button onclick="setDevice('pump', true)">Pump ON</button>
  <button onclick="setDevice('pump', false)">OFF</button>

  <button onclick="setDevice('light', true)">Light ON</button>
  <button onclick="setDevice('light', false)">OFF</button>

  <button onclick="setDevice('fan', true)">Fan ON</button>
  <button onclick="setDevice('fan', false)">OFF</button>
</div>

<script src="data.js"></script>
<script src="control.js"></script>
<script src="script.js"></script>

</body>
</html>
