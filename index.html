<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm Dashboard</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

h2{ margin-top:20px; }

.grid{
  display:grid;
  grid-template-columns:repeat(2,180px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:20px;
  border-radius:16px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.label{
  font-size:14px;
  opacity:0.7;
}

.value{
  font-size:32px;
  font-weight:bold;
  margin-top:5px;
}

.temp{ color:#f87171; }
.hum{ color:#38bdf8; }
.soil{ color:#22c55e; }
.lux{ color:#facc15; }

.connect{
  background:#3b82f6;
  color:white;
  padding:12px;
  border:none;
  border-radius:10px;
  width:160px;
  font-weight:bold;
  cursor:pointer;
}

.status{
  margin-top:10px;
  font-size:14px;
  opacity:0.8;
}

</style>
</head>

<body>

<h2>🤖 Smart Farm Dashboard</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<div class="status" id="status">Waiting connection...</div>

<div class="grid">

  <div class="card">
    <div class="label">🌡 Temperature</div>
    <div class="value temp" id="temp">--</div>
  </div>

  <div class="card">
    <div class="label">💧 Humidity</div>
    <div class="value hum" id="hum">--</div>
  </div>

  <div class="card">
    <div class="label">🌱 Soil Moisture</div>
    <div class="value soil" id="soil">--</div>
  </div>

  <div class="card">
    <div class="label">💡 Light (Lux)</div>
    <div class="value lux" id="lux">--</div>
  </div>

</div>

<script>

let port;
let buffer = "";
let latest = null;
let reader;

// ================= CONNECT =================
async function connectUSB(){

  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });

  document.getElementById("status").innerText = "Connected ✔";

  readData();
}

// ================= SAFE READ =================
async function readData(){

  const decoder = new TextDecoder();
  reader = port.readable.getReader();

  while(true){

    try{

      const { value, done } = await reader.read();

      if(done) break;

      buffer += decoder.decode(value);

      let lines = buffer.split("\n");
      buffer = lines.pop();

      for(let line of lines){

        let d = line.trim().split(",");
        if(d.length !== 4) continue;

        latest = {
          t: +d[0],
          h: +d[1],
          s: +d[2],
          l: +d[3]
        };
      }

    }catch(e){
      console.log("read error", e);
      break;
    }
  }
}

// ================= UI LOOP =================
setInterval(()=>{

  if(!latest) return;

  document.getElementById("temp").innerText = latest.t.toFixed(1);
  document.getElementById("hum").innerText  = latest.h.toFixed(1);
  document.getElementById("soil").innerText = latest.s;
  document.getElementById("lux").innerText  = latest.l.toFixed(0);

}, 100);

</script>

</body>
</html>
