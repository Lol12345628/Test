<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Smart Farm AI Pro</title>
</head>

<body>

<!-- Header -->

<header>
  <h1>🌱 Smart Farm AI Pro</h1>
  <p>IoT Monitoring System</p>
</header>

<!-- Summary Cards -->

<section id="dashboard">

  <div class="card">
    <h3>🌡️ Temperature</h3>
    <div id="temp">-- °C</div>
  </div>

  <div class="card">
    <h3>💧 Humidity</h3>
    <div id="hum">-- %</div>
  </div>

  <div class="card">
    <h3>🌱 Soil Moisture</h3>
    <div id="soil">--</div>
  </div>

  <div class="card">
    <h3>☀️ Light</h3>
    <div id="lux">-- lux</div>
  </div>

</section>

<!-- Device Control -->

<section id="controls">

  <h2>⚙️ Device Control</h2>

  <button id="pumpBtn">
    💧 Pump
  </button>

  <button id="lightBtn">
    💡 Grow Light
  </button>

  <button id="fanBtn">
    🌬️ Fan
  </button>

</section>

<!-- Status -->

<section id="status">

  <h2>📡 Device Status</h2>

  <div id="pumpStatus">
    Pump OFF
  </div>

  <div id="lightStatus">
    Light OFF
  </div>

  <div id="fanStatus">
    Fan OFF
  </div>

</section>

<!-- Charts -->

<section id="charts">

  <h2>📈 Temperature Chart</h2>
  <canvas id="tempChart"></canvas>

  <h2>📈 Humidity Chart</h2>
  <canvas id="humChart"></canvas>

  <h2>📈 Light Chart</h2>
  <canvas id="luxChart"></canvas>

</section>

<!-- AI Analysis -->

<section id="ai">

  <h2>🤖 AI Analysis</h2>

  <div id="analysis">
    Waiting data...
  </div>

</section>

<!-- Last Update -->

<footer>

  <div id="lastUpdate">
    Last Update : --
  </div>

</footer>

</body>
</html>
