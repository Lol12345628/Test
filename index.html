<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:16px;
  padding:15px;
  text-align:center;
  backdrop-filter:blur(10px);
}

.value{
  font-size:24px;
  color:#38bdf8;
}

/* BUTTON */
.btn{
  width:90%;
  padding:15px;
  margin:8px auto;
  display:block;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  transition:0.2s;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
</style>
</head>

<body>

<div class="header">🌱 SMART FARM DASHBOARD</div>

<div class="grid">
  <div class="card">🌡 TEMP<div class="value" id="t">0</div></div>
  <div class="card">💧 HUM<div class="value" id="h">0</div></div>
  <div class="card">🌱 SOIL<div class="value" id="s">0</div></div>
  <div class="card">☀ LIGHT<div class="value" id="l">0</div></div>
</div>

<!-- CONTROL (ปุ่มเดียวจบ) -->
<button class="btn on" onclick="cmd('water1')">💧 เปิดน้ำ</button>
<button class="btn off" onclick="cmd('water0')">ปิดน้ำ</button>

<button class="btn on" onclick="cmd('light1')">💡 เปิดไฟ</button>
<button class="btn off" onclick="cmd('light0')">ปิดไฟ</button>

<button class="btn on" onclick="cmd('fan1')">🌬 เปิดพัดลม</button>
<button class="btn off" onclick="cmd('fan0')">ปิดพัดลม</button>

<script>

const server = "https://test-lilac-one.vercel.app/api/sensor";

// ===== โหลดข้อมูล =====
function load(){
  fetch(server)
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("t").innerText = d.temp;
    document.getElementById("h").innerText = d.hum;
    document.getElementById("s").innerText = d.soil;
    document.getElementById("l").innerText = d.light;
  });
}

// ===== ส่งคำสั่ง =====
function cmd(c){
  fetch("/api/control?cmd=" + c);
}

setInterval(load,2000);

</script>

</body>
</html>
