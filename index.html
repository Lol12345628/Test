<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<title>Smart Farm PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top,#1e293b,#0f172a);
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:15px;
  text-align:center;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.value{
  font-size:26px;
  color:#38bdf8;
}

/* BUTTON */
.btn{
  width:90%;
  padding:16px;
  margin:10px auto;
  display:block;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.on{
  background:#22c55e;
  color:white;
}

.off{
  background:#ef4444;
  color:white;
}
</style>

</head>

<body>

<div class="header">🌱 SMART FARM DASHBOARD</div>

<div class="grid">
  <div class="card">🌡 TEMP <div class="value" id="t">0</div></div>
  <div class="card">💧 HUM <div class="value" id="h">0</div></div>
  <div class="card">🌱 SOIL <div class="value" id="s">0</div></div>
  <div class="card">☀ LIGHT <div class="value" id="l">0</div></div>
</div>

<!-- TOGGLE BUTTON -->
<button class="btn on" onclick="toggle('water1')">💧 WATER ON</button>
<button class="btn off" onclick="toggle('water0')">WATER OFF</button>

<button class="btn on" onclick="toggle('light1')">💡 LIGHT ON</button>
<button class="btn off" onclick="toggle('light0')">LIGHT OFF</button>

<button class="btn on" onclick="toggle('fan1')">🌬 FAN ON</button>
<button class="btn off" onclick="toggle('fan0')">FAN OFF</button>

<script>

const API = window.location.origin + "/api";

// ===== LOAD SENSOR =====
function load(){
  fetch(API + "/sensor")
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("t").innerText = d.temp;
    document.getElementById("h").innerText = d.hum;
    document.getElementById("s").innerText = d.soil;
    document.getElementById("l").innerText = d.light;
  });
}

// ===== SEND CONTROL =====
function toggle(cmd){
  fetch(API + "/control?cmd=" + cmd);
}

setInterval(load,2000);

</script>

</body>
</html>
