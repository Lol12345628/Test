<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm Control</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

h1{
  margin-top:20px;
}

.box{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:15px;
}

.card{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:12px;
}

.value{
  font-size:28px;
  font-weight:bold;
}

/* BUTTON */
button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:120px;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}

.ai{
  margin-top:10px;
  color:#38bdf8;
}

</style>
</head>

<body>

<h1>🤖 Smart Farm ESP32</h1>

<div class="ai" id="ai">AI loading...</div>
<div id="reason"></div>

<!-- SENSOR -->
<div class="box">

<div class="card">🌡 TEMP<br><div class="value" id="t">--</div></div>
<div class="card">💧 HUM<br><div class="value" id="h">--</div></div>
<div class="card">🌱 SOIL<br><div class="value" id="s">--</div></div>
<div class="card">💡 LIGHT<br><div class="value" id="l">--</div></div>

</div>

<!-- CONTROL -->
<div>

<button class="off" id="pump" onclick="toggle('pump')">💧 Pump</button>
<button class="off" id="fan" onclick="toggle('fan')">🌬 Fan</button>
<button class="off" id="light" onclick="toggle('light')">💡 Light</button>

</div>

<script>

let state={pump:0,fan:0,light:0};

const sensorURL="/api/sensor";
const controlURL="/api/control";

// ================= AI DISPLAY =================
function showAI(d){
  document.getElementById("ai").innerText="🤖 "+d.ai;
  document.getElementById("reason").innerText="💡 "+d.reason;
}

// ================= LOAD SENSOR =================
async function load(){

  const r=await fetch(sensorURL);
  const d=await r.json();
  const data=d.data;

  document.getElementById("t").innerText=data.temp.toFixed(1);
  document.getElementById("h").innerText=data.hum.toFixed(1);
  document.getElementById("s").innerText=data.soil;
  document.getElementById("l").innerText=data.light;

  showAI(data);
}

// ================= CONTROL =================
async function toggle(device){

  state[device]=!state[device];

  await fetch(controlURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      device:device,
      value:state[device]?1:0
    })
  });

  document.getElementById(device).className =
    state[device] ? "on" : "off";
}

// LOOP
setInterval(load,1200);

</script>

</body>
</html>
