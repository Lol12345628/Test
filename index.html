<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm FULL CONTROL</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.box {
  background:#111827;
  display:inline-block;
  padding:15px;
  margin:8px;
  border-radius:12px;
  width:160px;
}

.value { font-size:20px; color:#38bdf8; }

button {
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:160px;
}

.on { background:#22c55e; color:white; }
.off { background:#ef4444; color:white; }

.master { background:#f97316; color:white; }
.connect { background:#3b82f6; color:white; }

.ai {
  margin-top:15px;
  color:#93c5fd;
}
</style>
</head>

<body>

<h2>🌱 Smart Farm FULL CONTROL</h2>

<!-- CONNECT -->
<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<br><br>

<!-- SENSOR -->
<div class="box">🌡 Temp<br><div id="temp" class="value">-</div></div>
<div class="box">💧 Hum<br><div id="hum" class="value">-</div></div>
<div class="box">🌱 Soil<br><div id="soil" class="value">-</div></div>
<div class="box">💡 Lux<br><div id="lux" class="value">-</div></div>

<br>

<!-- CONTROL -->
<button id="pumpBtn" class="off" onclick="toggle('pump')">Pump OFF</button>
<button id="lightBtn" class="off" onclick="toggle('light')">Light OFF</button>
<button id="fanBtn" class="off" onclick="toggle('fan')">Fan OFF</button>

<br>

<!-- AUTO + MASTER OFF -->
<button class="on" onclick="send('auto_on')">🤖 AUTO ON</button>
<button class="off" onclick="send('auto_off')">AUTO OFF</button>

<br>

<button class="master" onclick="masterOff()">⛔ MASTER OFF</button>

<div class="ai" id="aiText">AI: waiting...</div>

<script>

let port, writer;

let state = {
  pump:false,
  light:false,
  fan:false
};

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();
  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== TOGGLE =====
async function toggle(d){
  state[d] = !state[d];
  let cmd = d + (state[d] ? "_on" : "_off");
  await send(cmd);
  updateUI();
}

// ===== MASTER OFF =====
async function masterOff(){

  state.pump = false;
  state.light = false;
  state.fan = false;

  await send("pump_off");
  await send("light_off");
  await send("fan_off");

  updateUI();

  document.getElementById("aiText").innerText = "AI: SYSTEM OFF ⛔";
}

// ===== UI =====
function updateUI(){

  pumpBtn.innerText = state.pump ? "Pump ON" : "Pump OFF";
  lightBtn.innerText = state.light ? "Light ON" : "Light OFF";
  fanBtn.innerText = state.fan ? "Fan ON" : "Fan OFF";

  pumpBtn.className = state.pump ? "on" : "off";
  lightBtn.className = state.light ? "on" : "off";
  fanBtn.className = state.fan ? "on" : "off";
}

// ===== SENSOR READ =====
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let l of lines){

      try {
        let d = JSON.parse(l);

        temp.innerText = d.temp.toFixed(1);
        hum.innerText  = d.hum.toFixed(1);
        soil.innerText = d.soil;
        lux.innerText  = d.lux.toFixed(0);

        ai(d);

      } catch(e){}
    }
  }
}

// ===== AI =====
function ai(d){

  let msg = "AI: Normal 🌿";

  if(d.soil < 35) msg = "AI: Soil dry → Pump ON 💧";
  else if(d.temp > 35) msg = "AI: Hot → Fan ON 🌬";
  else if(d.lux < 100) msg = "AI: Dark → Light ON 💡";

  document.getElementById("aiText").innerText = msg;
}

</script>

</body>
</html>
