String html = R"rawliteral(
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta charset="UTF-8">
<title>Smart Farm</title>

<style>
body{
  margin:0;
  font-family: 'Arial';
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  letter-spacing:1px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

/* CARD */
.card{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:0.2s;
}

.card:active{
  transform:scale(0.96);
}

.title{
  font-size:14px;
  opacity:0.8;
}

.value{
  font-size:26px;
  margin-top:6px;
  color:#38bdf8;
}

/* BUTTON */
.btn{
  width:90%;
  padding:16px;
  margin:8px auto;
  display:block;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  transition:0.2s;
}

.btn:active{
  transform:scale(0.95);
}

.on{
  background: linear-gradient(45deg,#22c55e,#16a34a);
  color:white;
  box-shadow:0 0 15px rgba(34,197,94,0.5);
}

.off{
  background: linear-gradient(45deg,#ef4444,#b91c1c);
  color:white;
  box-shadow:0 0 15px rgba(239,68,68,0.5);
}

/* FOOT */
.footer{
  text-align:center;
  padding:10px;
  opacity:0.6;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">🌱 SMART FARM CONTROL</div>

<div class="grid">
  <div class="card">
    <div class="title">🌡 TEMP</div>
    <div class="value" id="t">0</div>
  </div>

  <div class="card">
    <div class="title">💧 HUM</div>
    <div class="value" id="h">0</div>
  </div>

  <div class="card">
    <div class="title">🌱 SOIL</div>
    <div class="value" id="s">0</div>
  </div>

  <div class="card">
    <div class="title">☀ LIGHT</div>
    <div class="value" id="l">0</div>
  </div>
</div>

<!-- CONTROL -->
<button class="btn on" onclick="cmd('water1')">💧 เปิดน้ำ</button>
<button class="btn off" onclick="cmd('water0')">ปิดน้ำ</button>

<button class="btn on" onclick="cmd('light1')">💡 เปิดไฟ</button>
<button class="btn off" onclick="cmd('light0')">ปิดไฟ</button>

<button class="btn on" onclick="cmd('fan1')">🌬 เปิดพัดลม</button>
<button class="btn off" onclick="cmd('fan0')">ปิดพัดลม</button>

<div class="footer">ESP32 Smart Farm • Mobile UI</div>

<script>

setInterval(()=>{
  fetch('/data')
  .then(r=>r.json())
  .then(d=>{
    document.getElementById('t').innerText = d.temp;
    document.getElementById('h').innerText = d.hum;
    document.getElementById('s').innerText = d.soil;
    document.getElementById('l').innerText = d.light;
  });
},2000);

function cmd(c){
  fetch('/cmd?c='+c);
}

</script>

</body>
</html>
)rawliteral";
