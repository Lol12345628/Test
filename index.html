<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm Toggle</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.header{
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

/* CARD */
.card{
  margin:10px;
  padding:15px;
  background:rgba(255,255,255,0.08);
  border-radius:15px;
}

.value{
  font-size:24px;
  color:#38bdf8;
}

/* TOGGLE BUTTON */
.toggle{
  width:85%;
  padding:18px;
  margin:12px auto;
  border:none;
  border-radius:16px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

/* ON */
.on{
  background:linear-gradient(45deg,#22c55e,#16a34a);
  color:white;
  box-shadow:0 0 15px #22c55e;
}

/* OFF */
.off{
  background:linear-gradient(45deg,#ef4444,#b91c1c);
  color:white;
  box-shadow:0 0 15px #ef4444;
}
</style>
</head>

<body>

<div class="header">🌱 SMART FARM TOGGLE</div>

<div class="card">🌡 TEMP <div class="value" id="t">0</div></div>
<div class="card">💧 HUM <div class="value" id="h">0</div></div>
<div class="card">🌱 SOIL <div class="value" id="s">0</div></div>
<div class="card">☀ LIGHT <div class="value" id="l">0</div></div>

<!-- TOGGLE BUTTONS -->
<button id="waterBtn" class="toggle off" onclick="toggle('water')">
💧 WATER OFF
</button>

<button id="lightBtn" class="toggle off" onclick="toggle('light')">
💡 LIGHT OFF
</button>

<button id="fanBtn" class="toggle off" onclick="toggle('fan')">
🌬 FAN OFF
</button>

<script>

const server = "https://test-lilac-one.vercel.app/api";

// สถานะ
let state = {
  water:0,
  light:0,
  fan:0
};

// ===== โหลดข้อมูล =====
function load(){
  fetch(server + "/sensor")
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("t").innerText = d.temp;
    document.getElementById("h").innerText = d.hum;
    document.getElementById("s").innerText = d.soil;
    document.getElementById("l").innerText = d.light;
  });
}

// ===== TOGGLE =====
function toggle(type){

  state[type] = state[type] ? 0 : 1;

  fetch(server + "/control?cmd=" + type + state[type]);

  let btn = document.getElementById(type + "Btn");

  if(state[type] == 1){
    btn.className = "toggle on";
    btn.innerText = "✔ " + type.toUpperCase() + " ON";
  }else{
    btn.className = "toggle off";
    btn.innerText = "✖ " + type.toUpperCase() + " OFF";
  }
}

setInterval(load,2000);

</script>

</body>
</html>
