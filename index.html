<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI Dashboard</title>

<style>

body{
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

h2{ margin-top:15px; }

.grid{
  display:grid;
  grid-template-columns:repeat(2,170px);
  gap:12px;
  justify-content:center;
  margin-top:15px;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.value{
  font-size:28px;
  font-weight:bold;
}

button{
  padding:12px;
  margin:6px;
  width:150px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.connect{background:#3b82f6;color:white;}

.aiBox{
  margin-top:10px;
  color:#38bdf8;
  font-size:14px;
}

.reason{
  font-size:12px;
  opacity:0.8;
}

</style>
</head>

<body>

<h2>🤖 SMART FARM AI DASHBOARD</h2>

<button class="connect" onclick="connectUSB()">Connect USB</button>

<br>

<button id="pump" class="off" onclick="toggle('PUMP_ON','PUMP_OFF','pump')">Pump</button>
<button id="fan" class="off" onclick="toggle('FAN_ON','FAN_OFF','fan')">Fan</button>
<button id="light" class="off" onclick="toggle('LIGHT_ON','LIGHT_OFF','light')">Light</button>

<div class="aiBox" id="ai">AI: waiting sensor...</div>
<div class="reason" id="reason">---</div>

<div class="grid">

  <div class="card">🌡 Temp <div class="value" id="t">--</div></div>
  <div class="card">💧 Hum <div class="value" id="h">--</div></div>
  <div class="card">🌱 Soil <div class="value" id="s">--</div></div>
  <div class="card">💡 Light <div class="value" id="l">--</div></div>

</div>

<script>

let port, writer;

let state = {
  pump:0,
  fan:0,
  light:0
};

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== TOGGLE =====
function toggle(on,off,key){

  state[key] = !state[key];

  send(state[key] ? on : off);

  document.getElementById(key).className =
    state[key] ? "on" : "off";
}

// ===== AI LOGIC DISPLAY =====
function ai(t,s,l){

  let msg="AI: normal";
  let reason="system stable";

  if(s < 30){
    msg="AI: pump ON";
    reason="soil dry → watering needed";
  }
  else if(t > 35){
    msg="AI: fan ON";
    reason="temperature high → cooling needed";
  }
  else if(l < 100){
    msg="AI: light ON";
    reason="low light → growth support";
  }

  document.getElementById("ai").innerText = msg;
  document.getElementById("reason").innerText = reason;
}

// ===== READ =====
async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      let t=+d[0], h=+d[1], s=+d[2], lx=+d[3];

      document.getElementById("t").innerText=t.toFixed(1);
      document.getElementById("h").innerText=h.toFixed(1);
      document.getElementById("s").innerText=s;
      document.getElementById("l").innerText=lx;

      ai(t,s,lx);
    }
  }
}

</script>

</body>
</html>
