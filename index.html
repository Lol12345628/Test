<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Farm Mobile</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* Header */
.header{
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

/* Grid (มือถือ = 1 คอลัมน์) */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:15px;
}

/* Card */
.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  padding:15px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.value{
  font-size:26px;
  color:#38bdf8;
  margin-top:5px;
}

/* Buttons */
.btn{
  width:90%;
  padding:15px;
  margin:5px auto;
  display:block;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }

.control{
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<div class="header">🌱 Smart Farm Mobile</div>

<div class="grid">
  <div class="card">🌡 Temp <div class="value" id="temp">0</div></div>
  <div class="card">💧 Hum <div class="value" id="hum">0</div></div>
  <div class="card">🌱 Soil <div class="value" id="soil">0</div></div>
  <div class="card">☀ Light <div class="value" id="light">0</div></div>
</div>

<div class="control">

<h3>Control</h3>

<button class="btn on" onclick="cmd('water1')">💧 เปิดน้ำ</button>
<button class="btn off" onclick="cmd('water0')">ปิดน้ำ</button>

<button class="btn on" onclick="cmd('light1')">💡 เปิดไฟ</button>
<button class="btn off" onclick="cmd('light0')">ปิดไฟ</button>

<button class="btn on" onclick="cmd('fan1')">🌬 เปิดพัดลม</button>
<button class="btn off" onclick="cmd('fan0')">ปิดพัดลม</button>

</div>

<script>

const server = "http://192.168.1.25"; // ใส่ IP ESP32

function loadData(){
  fetch(server + "/data")
  .then(r => r.json())
  .then(d => {
    document.getElementById("temp").innerText = d.temp;
    document.getElementById("hum").innerText = d.hum;
    document.getElementById("soil").innerText = d.soil;
    document.getElementById("light").innerText = d.light;
  });
}

function cmd(c){
  fetch(server + "/cmd?c=" + c);
}

setInterval(loadData, 2000);

</script>

</body>
</html>
