<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm FINAL</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,160px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:18px;
  border-radius:16px;
}

.value{ font-size:26px; font-weight:bold; }

.temp{ color:#f87171; }
.hum{ color:#38bdf8; }
.soil{ color:#22c55e; }
.lux{ color:#facc15; }

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:150px;
}

.connect{ background:#3b82f6; color:white; }
.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }
.auto{ background:#a855f7; color:white; }

.aiBox{
  margin-top:15px;
  padding:10px;
  background:#1e293b;
  border-radius:10px;
  display:inline-block;
}
</style>
</head>

<body>

<h2>🤖 Smart Farm FINAL SYSTEM</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect</button>
<button class="auto" onclick="toggleAuto()">AUTO: OFF</button>

<br>

<button onclick="manual('pump')" id="pumpBtn" class="off">Pump OFF</button>
<button onclick="manual('light')" id="lightBtn" class="off">Light OFF</button>
<button onclick="manual('fan')" id="fanBtn" class="off">Fan OFF</button>

<div class="grid">
  <div class="card">🌡 <div id="temp" class="value temp">-</div></div>
  <div class="card">💧 <div id="hum" class="value hum">-</div></div>
  <div class="card">🌱 <div id="soil" class="value soil">-</div></div>
  <div class="card">💡 <div id="lux" class="value lux">-</div></div>
</div>

<div class="aiBox" id="aiText">AI: standby</div>

<script>

let port, writer;
let autoMode = false;

// 🔥 QUEUE กันค้าง
let queue = [];
let sending = false;

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });

  writer = port.writable.getWriter();

  readLoop();
}

// ===== SEND SAFE =====
function send(cmd){
  queue.push(cmd);
  processQueue();
}

async function processQueue(){

  if(sending || queue.length === 0) return;
  if(!writer) return;

  sending = true;

  const cmd = queue.shift();

  try{
    await writer.write(new TextEncoder().encode(cmd + "\n"));
  }catch(e){
    console.log(e);
  }

  sending = false;

  setTimeout(processQueue, 20);
}

// ===== AUTO =====
function toggleAuto(){
  autoMode = !autoMode;
  send(autoMode ? "auto_on" : "auto_off");
}

// ===== MANUAL =====
function manual(dev){
  send(dev + "_on");
}

// ===== READ =====
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  const tEl = document.getElementById("temp");
  const hEl = document.getElementById("hum");
  const sEl = document.getElementById("soil");
  const lEl = document.getElementById("lux");

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let d = line.split(",");
      if(d.length != 4) continue;

      tEl.innerText = (+d[0]).toFixed(1);
      hEl.innerText = (+d[1]).toFixed(1);
      sEl.innerText = d[2];
      lEl.innerText = (+d[3]).toFixed(0);
    }
  }
}

</script>

</body>
</html>
