<!DOCTYPE html>

<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🌱 Smart Farm AI Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
padding:15px;
}

.header{
text-align:center;
padding:20px;
background:#111827;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 0 25px rgba(0,0,0,.3);
}

.title{
font-size:30px;
font-weight:600;
}

.status{
margin-top:10px;
font-size:15px;
}

.online{
color:#22c55e;
}

.offline{
color:#ef4444;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
margin-bottom:15px;
}

.card{
background:#1e293b;
padding:18px;
border-radius:20px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.25);
}

.card .icon{
font-size:28px;
}

.card .label{
opacity:.8;
margin-top:8px;
}

.card .value{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.ai-box{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:15px;
}

.ai-title{
font-size:24px;
color:#38bdf8;
}

.reason{
margin-top:10px;
font-size:15px;
color:#cbd5e1;
}

.mode-box{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:15px;
}

.mode-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
}

.auto{
background:#22c55e;
}

.manual{
background:#f59e0b;
}

.control-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-bottom:15px;
}

.btn{
border:none;
padding:18px;
border-radius:18px;
font-size:17px;
font-weight:bold;
cursor:pointer;
color:white;
transition:.2s;
}

.btn:active{
transform:scale(.95);
}

.on{
background:#22c55e;
}

.off{
background:#ef4444;
}

.history{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:15px;
}

.footer{
text-align:center;
opacity:.7;
padding:10px;
}

canvas{
background:white;
border-radius:15px;
padding:10px;
}

</style>

</head>

<body>

<div class="header">

<div class="title">
🌱 Smart Farm AI Pro
</div>

<div id="wifi" class="status online">
🟢 Online
</div>

</div>

<div class="grid">

<div class="card">
<div class="icon">🌡</div>
<div class="label">Temperature</div>
<div id="temp" class="value">--</div>
</div>

<div class="card">
<div class="icon">💧</div>
<div class="label">Humidity</div>
<div id="hum" class="value">--</div>
</div>

<div class="card">
<div class="icon">🌱</div>
<div class="label">Soil</div>
<div id="soil" class="value">--</div>
</div>

<div class="card">
<div class="icon">☀</div>
<div class="label">Light</div>
<div id="lux" class="value">--</div>
</div>

</div>

<div class="ai-box">

<div class="ai-title">
🤖 AI Analysis
</div>

<div id="reason" class="reason">
Waiting...
</div>

</div>

<div class="mode-box">

<button id="modeBtn"
class="mode-btn auto">

AUTO MODE

</button>

</div>

<div class="control-grid">

<button id="pumpBtn"
class="btn off">

💧 Pump OFF

</button>

<button id="fanBtn"
class="btn off">

🌬 Fan OFF

</button>

<button id="lightBtn"
class="btn off">

💡 Light OFF

</button>

</div>

<div class="history">

<h2>📈 History</h2>

<br>

<canvas id="chart"></canvas>

</div>

<div class="footer">

Last Update: <span id="time">--</span>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="app.js"></script>

</body>
</html>
