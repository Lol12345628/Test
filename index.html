<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm Control</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  margin: 10px;
  border-radius: 15px;
  display: inline-block;
}

button {
  padding: 12px 18px;
  margin: 6px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.on { background:#22c55e; color:white; }
.off { background:#ef4444; color:white; }
</style>
</head>

<body>

<h1>🌱 Smart Farm USB Control</h1>

<div class="card">
  Control Panel
</div>

<br><br>

<button class="on" onclick="send('pump_on')">Pump ON</button>
<button class="off" onclick="send('pump_off')">OFF</button>
<br>

<button class="on" onclick="send('light_on')">Light ON</button>
<button class="off" onclick="send('light_off')">OFF</button>
<br>

<button class="on" onclick="send('fan_on')">Fan ON</button>
<button class="off" onclick="send('fan_off')">OFF</button>

<script>
async function send(cmd){

  await fetch("http://localhost:5000/control", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({cmd})
  });

}
</script>

</body>
</html>
