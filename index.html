<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 Control FIX</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button {
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.on { background:#22c55e; }
.off { background:#ef4444; }
.connect { background:#3b82f6; }
</style>
</head>

<body>

<h2>🌱 ESP32 CONTROL FIX</h2>

<button class="connect" onclick="connectUSB()">Connect USB</button>

<br><br>

<button class="on" onclick="toggle('pump')">Pump</button>
<button class="on" onclick="toggle('light')">Light</button>
<button class="on" onclick="toggle('fan')">Fan</button>

<script>

let port;
let writer;

let state = {
  pump:false,
  light:false,
  fan:false
};

// ===== CONNECT =====
async function connectUSB(){
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    writer = port.writable.getWriter();

    alert("Connected ESP32");
  } catch(e){
    alert("Connect failed");
  }
}

// ===== TOGGLE FIX =====
async function toggle(device){

  if(!writer){
    alert("ต้องกด Connect ก่อน");
    return;
  }

  state[device] = !state[device];

  let cmd = device + (state[device] ? "_on" : "_off");

  const data = new TextEncoder().encode(cmd + "\n");

  await writer.write(data);

  console.log("sent:", cmd);
}

</script>

</body>
</html>
