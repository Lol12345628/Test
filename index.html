<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI CONTROL</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  margin:5px;
  width:160px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.connect{background:#3b82f6;color:white;}

.box{
  margin:10px;
  padding:10px;
  background:#111827;
  display:inline-block;
  width:160px;
}

.ai{
  margin-top:10px;
  color:#38bdf8;
}

</style>
</head>

<body>

<h2>🤖 Smart Farm AI SYSTEM</h2>

<button class="connect" onclick="connectUSB()">Connect</button>

<br>

<button id="pump" class="off" onclick="toggle('PUMP_ON','PUMP_OFF','pump')">Pump</button>
<button id="light" class="off" onclick="toggle('LIGHT_ON','LIGHT_OFF','light')">Light</button>
<button id="fan" class="off" onclick="toggle('FAN_ON','FAN_OFF','fan')">Fan</button>

<div class="ai" id="ai">AI: waiting data...</div>

<br>

<div class="box">🌡 <div id="t">-</div></div>
<div class="box">💧 <div id="h">-</div></div>
<div class="box">🌱 <div id="s">-</div></div>
<div class="box">💡 <div id="l">-</div></div>

<script>

let port, writer;
let state = {pump:0,light:0,fan:0};

async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

function toggle(on,off,key){

  state[key] = state[key] ? 0 : 1;

  send(state[key] ? on : off);

  document.getElementById(key).className =
    state[key] ? "on" : "off";
}

// ===== AI DISPLAY =====
function ai(t,soil,lux){

  let msg="AI: normal";

  if(soil < 30) msg="AI: soil dry → pump ON";
  else if(t > 35) msg="AI: hot → fan ON";
  else if(lux < 100) msg="AI: dark → light ON";

  document.getElementById("ai").innerText = msg;
}

// ===== READ =====
async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      let t=+d[0], h=+d[1], s=+d[2], lgt=+d[3];

      document.getElementById("t").innerText=t;
      document.getElementById("h").innerText=h;
      document.getElementById("s").innerText=s;
      document.getElementById("l").innerText=lgt;

      ai(t,s,lgt);
    }
  }
}

</script>

</body>
</html>
