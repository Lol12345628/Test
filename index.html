<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Farm PRO</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  margin:5px;
  width:150px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.connect{background:#3b82f6;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(2,160px);
  gap:10px;
  justify-content:center;
  margin-top:10px;
}

.card{
  background:#111827;
  padding:12px;
  border-radius:12px;
}

.value{
  font-size:24px;
  font-weight:bold;
}

.ai{
  margin-top:10px;
  color:#38bdf8;
}

.learn{
  font-size:12px;
  opacity:0.7;
}

</style>
</head>

<body>

<h2>🤖 AI FARM PRO</h2>

<button class="connect" onclick="connectUSB()">Connect</button>

<br>

<button onclick="send('PUMP_ON')">Pump</button>
<button onclick="send('LIGHT_ON')">Light</button>
<button onclick="send('FAN_ON')">Fan</button>

<div class="ai" id="ai">AI: waiting...</div>
<div class="learn" id="learn">learning...</div>

<div class="grid">

<div class="card">🌡 <div id="t" class="value">-</div></div>
<div class="card">💧 <div id="h" class="value">-</div></div>
<div class="card">🌱 <div id="s" class="value">-</div></div>
<div class="card">💡 <div id="l" class="value">-</div></div>

</div>

<script>

let port, writer;

async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== AI DISPLAY =====
function ai(t,s,l){

  let msg="AI: normal";

  if(s < 30) msg="AI → pump ON (dry trend)";
  else if(t > 35) msg="AI → fan ON (heat rising)";
  else if(l < 100) msg="AI → light ON (dark trend)";

  document.getElementById("ai").innerText = msg;
}

// ===== LEARNING DISPLAY =====
function learn(a){

  document.getElementById("learn").innerText =
  `soilAvg:${a.soil} tempAvg:${a.temp} luxAvg:${a.lux}`;
}

// ===== READ =====
async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length < 7) continue;

      let t=+d[0];
      let h=+d[1];
      let s=+d[2];
      let lx=+d[3];
      let sa=+d[4];
      let ta=+d[5];
      let la=+d[6];

      document.getElementById("t").innerText=t.toFixed(1);
      document.getElementById("h").innerText=h.toFixed(1);
      document.getElementById("s").innerText=s;
      document.getElementById("l").innerText=lx;

      ai(t,s,lx);
      learn({soil:sa,temp:ta,lux:la});
    }
  }
}

</script>

</body>
</html>
