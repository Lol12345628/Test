<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 USB UI</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

h2 { margin-top: 20px; }

button {
  padding: 12px 18px;
  margin: 6px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.connect { background: #3b82f6; color: white; }

.on { background: #22c55e; color: white; }
.off { background: #ef4444; color: white; }
</style>
</head>

<body>

<h2>🌱 ESP32 USB Control (Direct)</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<br><br>

<button class="on" onclick="sendCmd('pump_on')">Pump ON</button>
<button class="off" onclick="sendCmd('pump_off')">OFF</button>

<br>

<button class="on" onclick="sendCmd('light_on')">Light ON</button>
<button class="off" onclick="sendCmd('light_off')">OFF</button>

<br>

<button class="on" onclick="sendCmd('fan_on')">Fan ON</button>
<button class="off" onclick="sendCmd('fan_off')">OFF</button>

<script>

let port;
let writer;

// ===== CONNECT USB =====
async function connectUSB() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    writer = port.writable.getWriter();

    alert("Connected ESP32!");
  } catch (err) {
    alert("Connect failed: " + err);
  }
}

// ===== SEND COMMAND =====
async function sendCmd(cmd) {
  if (!writer) {
    alert("Please connect USB first!");
    return;
  }

  const data = new TextEncoder().encode(cmd + "\n");
  await writer.write(data);
}

</script>

</body>
</html>
