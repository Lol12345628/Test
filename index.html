<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI Pro</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0b1220,#1e293b);
  color:white;
}

/* HEADER */
.header{
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* CONNECT */
.connect{
  background:#3b82f6;
  border:none;
  padding:12px;
  color:white;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(10px);
  border-radius:16px;
  padding:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.label{
  font-size:13px;
  opacity:0.7;
}

.value{
  font-size:28px;
  font-weight:bold;
  margin-top:5px;
}

/* BUTTONS */
.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px;
}

.btn{
  width:100px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}

/* AI BOX */
.aiBox{
  margin:10px;
  text-align:center;
  color:#38bdf8;
  font-size:14px;
}

.reason{
  text-align:center;
  font-size:12px;
  opacity:0.8;
}

/* STATUS */
.badge{
  display:inline-block;
  padding:5px 12px;
  background:#1e40af;
  border-radius:20px;
  font-size:11px;
  margin-top:5px;
}

</style>
</head>

<body>

<div class="header">🤖 Smart Farm AI Dashboard</div>

<div style="text-align:center;">
<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>
<br>
<span class="badge" id="mode">AUTO AI READY</span>
</div>

<div class="buttons">
<button id="pump" class="off" onclick="toggle('PUMP_ON','PUMP_OFF','pump')">💧 Pump</button>
<button id="fan" class="off" onclick="toggle('FAN_ON','FAN_OFF','fan')">🌬 Fan</button>
<button id="light" class="off" onclick="toggle('LIGHT_ON','LIGHT_OFF','light')">💡 Light</button>
</div>

<div class="aiBox" id="ai">AI: waiting sensor data...</div>
<div class="reason" id="reason">---</div>

<div class="grid">

<div class="card">
<div class="label">🌡 Temperature</div>
<div class="value" id="t">--</div>
</div>

<div class="card">
<div class="label">💧 Humidity</div>
<div class="value" id="h">--</div>
</div>

<div class="card">
<div class="label">🌱 Soil Moisture</div>
<div class="value" id="s">--</div>
</div>

<div class="card">
<div class="label">💡 Light</div>
<div class="value" id="l">--</div>
</div>

</div>

<script>

let port, writer;
let state = {pump:0,fan:0,light:0};

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== TOGGLE =====
function toggle(on,off,key){

  state[key] = !state[key];

  send(state[key] ? on : off);

  document.getElementById(key).className =
    state[key] ? "btn on" : "btn off";

  document.getElementById("mode").innerText =
    "MANUAL OVERRIDE (AI PAUSED)";
}

// ===== AI EXPLAIN =====
function ai(t,s,l){

  let msg="AI: system stable";
  let reason="All sensors normal";

  if(s < 30){
    msg="AI: PUMP ON";
    reason="Soil is dry → watering required";
  }
  else if(t > 35){
    msg="AI: FAN ON";
    reason="Temperature high → cooling activated";
  }
  else if(l < 100){
    msg="AI: LIGHT ON";
    reason="Low light → plant growth support";
  }

  document.getElementById("ai").innerText = msg;
  document.getElementById("reason").innerText = reason;
}

// ===== READ =====
async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      let t=+d[0];
      let h=+d[1];
      let s=+d[2];
      let lx=+d[3];

      document.getElementById("t").innerText=t.toFixed(1);
      document.getElementById("h").innerText=h.toFixed(1);
      document.getElementById("s").innerText=s;
      document.getElementById("l").innerText=lx;

      ai(t,s,lx);
    }
  }
}

</script>

</body>
</html>
