<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI USB FIX</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  text-align: center;
}

h1 { margin-top: 20px; }

button {
  padding: 14px;
  margin: 6px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  width: 160px;
}

.connect { background:#3b82f6; color:white; }
.on { background:#22c55e; color:white; }
.off { background:#ef4444; color:white; }

.ai {
  margin-top:20px;
  color:#93c5fd;
}
</style>
</head>

<body>

<h1>🌱 Smart Farm AI USB</h1>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<br><br>

<button id="pumpBtn" class="off" onclick="toggle('pump')">Pump OFF</button>
<button id="lightBtn" class="off" onclick="toggle('light')">Light OFF</button>
<button id="fanBtn" class="off" onclick="toggle('fan')">Fan OFF</button>

<div class="ai" id="aiText">AI: waiting connection...</div>

<script>

let port, writer;

let state = {
  pump:false,
  light:false,
  fan:false
};

// ===== CONNECT USB =====
async function connectUSB(){
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    writer = port.writable.getWriter();

    document.getElementById("aiText").innerText = "AI: USB Connected ✅";

  } catch(e){
    alert("Connect failed: " + e);
  }
}

// ===== SEND SAFE =====
async function send(cmd){
  if(!writer){
    alert("ยังไม่ได้ Connect USB");
    return false;
  }

  try {
    await writer.write(new TextEncoder().encode(cmd + "\n"));
    return true;
  } catch(e){
    alert("USB Error");
    return false;
  }
}

// ===== TOGGLE FIX =====
async function toggle(device){

  if(!writer){
    alert("Connect USB ก่อน");
    return;
  }

  state[device] = !state[device];

  let cmd = device + (state[device] ? "_on" : "_off");

  let ok = await send(cmd);

  if(ok){
    updateUI();
    ai();
  }
}

// ===== UI FIX (ชัวร์ 100%) =====
function updateUI(){

  const pumpBtn = document.getElementById("pumpBtn");
  const lightBtn = document.getElementById("lightBtn");
  const fanBtn = document.getElementById("fanBtn");

  pumpBtn.innerText = state.pump ? "Pump ON" : "Pump OFF";
  lightBtn.innerText = state.light ? "Light ON" : "Light OFF";
  fanBtn.innerText = state.fan ? "Fan ON" : "Fan OFF";

  pumpBtn.className = state.pump ? "on" : "off";
  lightBtn.className = state.light ? "on" : "off";
  fanBtn.className = state.fan ? "on" : "off";
}

// ===== AI =====
function ai(){

  let msg = "AI: Normal 🌿";

  if(state.pump && state.fan){
    msg = "AI: High load 💧🌬";
  }
  else if(state.pump){
    msg = "AI: Watering 💧";
  }
  else if(state.fan){
    msg = "AI: Cooling 🌬";
  }

  document.getElementById("aiText").innerText = msg;
}

updateUI();

</script>

</body>
</html>
