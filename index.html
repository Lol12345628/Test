<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 Smart Farm AI Pro</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  min-height:100vh;
}

.header{
  background:#111827;
  padding:20px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.status{
  margin-top:8px;
  font-size:14px;
}

.online{
  color:#22c55e;
}

.offline{
  color:#ef4444;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  padding:15px;
}

.card{
  background:#1e293b;
  border-radius:18px;
  padding:18px;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:translateY(-3px);
}

.label{
  opacity:.8;
  font-size:14px;
}

.value{
  font-size:30px;
  font-weight:bold;
  margin-top:10px;
}

.ai-box{
  margin:15px;
  background:#1e293b;
  border-radius:18px;
  padding:18px;
}

.ai-title{
  font-size:22px;
  font-weight:bold;
}

.ai-on{
  color:#22c55e;
}

.ai-warn{
  color:#f59e0b;
}

.reason{
  margin-top:10px;
  color:#cbd5e1;
}

.control{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  padding:15px;
}

.btn{
  border:none;
  border-radius:16px;
  padding:16px;
  color:white;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.on{
  background:#22c55e;
}

.off{
  background:#ef4444;
}

.footer{
  text-align:center;
  padding:20px;
  opacity:.7;
}

</style>

</head>

<body>

<div class="header">
  <h1>🌱 Smart Farm AI Pro</h1>

  <div id="wifi" class="status online">
    ● Online
  </div>
</div>

<div class="grid">

  <div class="card">
    <div class="label">🌡 อุณหภูมิ</div>
    <div class="value" id="temp">--</div>
  </div>

  <div class="card">
    <div class="label">💧 ความชื้น</div>
    <div class="value" id="hum">--</div>
  </div>

  <div class="card">
    <div class="label">🌱 ดิน</div>
    <div class="value" id="soil">--</div>
  </div>

  <div class="card">
    <div class="label">☀ แสง</div>
    <div class="value" id="light">--</div>
  </div>

  <div class="card">
    <div class="label">🎯 Confidence</div>
    <div class="value" id="confidence">--</div>
  </div>

  <div class="card">
    <div class="label">📈 Trend</div>
    <div class="value" id="trend">--</div>
  </div>

</div>

<div class="ai-box">

  <div id="ai" class="ai-title">
    🤖 AI กำลังวิเคราะห์...
  </div>

  <div id="reason" class="reason">
    รอข้อมูลเซ็นเซอร์...
  </div>

</div>

<div class="control">

<button id="pumpBtn"
       class="btn off"
       onclick="toggle('pump')">
💧 Pump OFF </button>

<button id="fanBtn"
       class="btn off"
       onclick="toggle('fan')">
🌬 Fan OFF </button>

<button id="lightBtn"
       class="btn off"
       onclick="toggle('light')">
💡 Light OFF </button>

</div>

<div class="footer">
  Last Update :
  <span id="time">--</span>
</div>

<script>

let state = {
  pump:false,
  fan:false,
  light:false
};

let busy = false;

function updateButton(id,on,name){

  const btn =
    document.getElementById(id);

  if(on){
    btn.className="btn on";
    btn.innerText=name+" ON";
  }else{
    btn.className="btn off";
    btn.innerText=name+" OFF";
  }
}

async function loadControl(){

  try{

    const res =
      await fetch("/api/control");

    const data =
      await res.json();

    state = {
      pump: !!data.pump,
      fan: !!data.fan,
      light: !!data.light
    };

    updateButton(
      "pumpBtn",
      state.pump,
      "💧 Pump"
    );

    updateButton(
      "fanBtn",
      state.fan,
      "🌬 Fan"
    );

    updateButton(
      "lightBtn",
      state.light,
      "💡 Light"
    );

  }catch(err){
    console.log(err);
  }
}

async function toggle(device){

  if(busy) return;

  busy = true;

  try{

    state[device] =
      !state[device];

    updateButton(
      device+"Btn",
      state[device],
      device==="pump"
      ? "💧 Pump"
      : device==="fan"
      ? "🌬 Fan"
      : "💡 Light"
    );

    await fetch(
      "/api/control",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/json"
        },
        body:JSON.stringify({
          device,
          value:
          state[device] ? 1 : 0
        })
      }
    );

  }catch(err){
    console.log(err);
  }

  busy = false;
}

async function loadSensor(){

  try{

    const res =
      await fetch("/api/sensor");

    const json =
      await res.json();

    const d =
      json.data;

    document.getElementById(
      "temp"
    ).innerText =
      d.sensors.temp + "°C";

    document.getElementById(
      "hum"
    ).innerText =
      d.sensors.hum + "%";

    document.getElementById(
      "soil"
    ).innerText =
      d.sensors.soil + "%";

    document.getElementById(
      "light"
    ).innerText =
      d.sensors.light;

    document.getElementById(
      "confidence"
    ).innerText =
      d.ai.confidence + "%";

    document.getElementById(
      "trend"
    ).innerText =
      d.learning.trend;

    const ai =
      document.getElementById(
        "ai"
      );

    ai.innerText =
      "🤖 " +
      d.ai.actions.join(
        " | "
      );

    document.getElementById(
      "reason"
    ).innerText =
      d.ai.reasons.join(
        ", "
      );

    if(
      d.ai.actions.includes(
        "PUMP_ON"
      )
    ){
      ai.className =
        "ai-title ai-on";
    }
    else if(
      d.ai.actions.includes(
        "PREDICT_WATER_SOON"
      )
    ){
      ai.className =
        "ai-title ai-warn";
    }
    else{
      ai.className =
        "ai-title";
    }

    document.getElementById(
      "wifi"
    ).className =
      "status online";

    document.getElementById(
      "wifi"
    ).innerText =
      "● Online";

    document.getElementById(
      "time"
    ).innerText =
      new Date()
      .toLocaleTimeString();

  }
  catch(err){

    document.getElementById(
      "wifi"
    ).className =
      "status offline";

    document.getElementById(
      "wifi"
    ).innerText =
      "● Offline";
  }
}

loadControl();
loadSensor();

setInterval(
  loadSensor,
  1000
);

</script>

</body>
</html>
