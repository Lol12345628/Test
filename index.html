<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.box {
  display:inline-block;
  background:#111827;
  padding:15px;
  margin:8px;
  border-radius:12px;
  width:150px;
}

.value {
  font-size:22px;
  font-weight:bold;
  color:#38bdf8;
}

button {
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.connect { background:#3b82f6; color:white; }
</style>
</head>

<body>

<h2>🌱 Smart Farm Live Sensor</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<br><br>

<div class="box">🌡 Temp<br><div id="temp" class="value">-</div></div>
<div class="box">💧 Hum<br><div id="hum" class="value">-</div></div>
<div class="box">🌱 Soil<br><div id="soil" class="value">-</div></div>
<div class="box">💡 Lux<br><div id="lux" class="value">-</div></div>

<div id="ai" style="margin-top:20px;color:#93c5fd;">
AI: waiting data...
</div>

<script>

let port, writer;

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();

  readLoop();
}

// ===== READ SENSOR =====
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      try {
        let data = JSON.parse(line);

        document.getElementById("temp").innerText = data.temp.toFixed(1);
        document.getElementById("hum").innerText  = data.hum.toFixed(1);
        document.getElementById("soil").innerText = data.soil;
        document.getElementById("lux").innerText  = data.lux.toFixed(0);

        ai(data);

      } catch(e){}
    }
  }
}

// ===== AI =====
function ai(d){

  let msg = "AI: Normal 🌿";

  if(d.soil < 35){
    msg = "AI: Soil dry → Pump ON 💧";
  }
  else if(d.temp > 35){
    msg = "AI: Hot → Fan ON 🌬";
  }
  else if(d.lux < 100){
    msg = "AI: Dark → Light ON 💡";
  }

  document.getElementById("ai").innerText = msg;
}

</script>

</body>
</html>
