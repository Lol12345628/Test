<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:16px;
  padding:15px;
  text-align:center;
}

.value{
  font-size:24px;
  color:#38bdf8;
}

/* BUTTON */
.btn{
  width:90%;
  padding:16px;
  margin:8px auto;
  display:block;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
</style>
</head>

<body>

<div class="header">🌱 SMART FARM DASHBOARD</div>

<div class="grid">
  <div class="card">🌡 TEMP<div class="value" id="t">0</div></div>
  <div class="card">💧 HUM<div class="value" id="h">0</div></div>
  <div class="card">🌱 SOIL<div class="value" id="s">0</div></div>
  <div class="card">☀ LIGHT<div class="value" id="l">0</div></div>
</div>

<!-- TOGGLE BUTTON -->
<button id="waterBtn" class="btn off" onclick="toggle('water')">💧 WATER OFF</button>
<button id="lightBtn" class="btn off" onclick="toggle('light')">💡 LIGHT OFF</button>
<button id="fanBtn" class="btn off" onclick="toggle('fan')">🌬 FAN OFF</button>

<script>

// 🔥 เปลี่ยนเป็น IP ESP32
const ESP32 = "http://192.168.1.25";

let state = {
  water:0,
  light:0,
  fan:0
};

// ===== LOAD SENSOR =====
function load(){
  fetch(ESP32 + "/data")
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("t").innerText = d.temp;
    document.getElementById("h").innerText = d.hum;
    document.getElementById("s").innerText = d.soil;
    document.getElementById("l").innerText = d.light;
  });
}

// ===== TOGGLE BUTTON =====
function toggle(type){

  state[type] = state[type] ? 0 : 1;

  fetch(ESP32 + "/cmd?c=" + type + state[type]);

  let btn = document.getElementById(type + "Btn");

  if(state[type]){
    btn.className = "btn on";
    btn.innerText = "✔ " + type.toUpperCase() + " ON";
  }else{
    btn.className = "btn off";
    btn.innerText = "✖ " + type.toUpperCase() + " OFF";
  }
}

setInterval(load,2000);

</script>

</body>
</html>
