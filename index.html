<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm Dashboard</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 160px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

/* ===== CARD ===== */
.card{
  background:#111827;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.title{
  font-size:14px;
  color:#94a3b8;
}

.value{
  font-size:26px;
  font-weight:bold;
  margin-top:5px;
}

/* สีแต่ละ sensor */
.temp { color:#f87171; }
.hum  { color:#38bdf8; }
.soil { color:#22c55e; }
.lux  { color:#facc15; }

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.connect{ background:#3b82f6; color:white; }

</style>
</head>

<body>

<h2>🌱 Smart Farm Dashboard</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<!-- SENSOR CARDS -->
<div class="grid">

  <div class="card">
    <div class="title">🌡 Temperature</div>
    <div id="temp" class="value temp">-</div>
  </div>

  <div class="card">
    <div class="title">💧 Humidity</div>
    <div id="hum" class="value hum">-</div>
  </div>

  <div class="card">
    <div class="title">🌱 Soil</div>
    <div id="soil" class="value soil">-</div>
  </div>

  <div class="card">
    <div class="title">💡 Light (Lux)</div>
    <div id="lux" class="value lux">-</div>
  </div>

</div>

<script>

let port;

// 🔌 connect
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });

  readLoop();
}

// 📡 read
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let d = line.trim().split(",");
      if(d.length < 4) continue;

      document.getElementById("temp").innerText = parseFloat(d[0]).toFixed(1);
      document.getElementById("hum").innerText  = parseFloat(d[1]).toFixed(1);
      document.getElementById("soil").innerText = d[2];
      document.getElementById("lux").innerText  = parseFloat(d[3]).toFixed(0);
    }
  }
}

</script>

</body>
</html>
