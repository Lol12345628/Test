<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Farm Toggle</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.header{
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

.card{
  margin:10px;
  padding:15px;
  background:rgba(255,255,255,0.1);
  border-radius:15px;
}

.value{
  font-size:26px;
  color:#38bdf8;
}

.btn{
  width:80%;
  padding:18px;
  margin:10px;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.on{
  background:#22c55e;
  color:white;
}

.off{
  background:#ef4444;
  color:white;
}
</style>
</head>

<body>

<div class="header">🌱 Smart Farm Toggle</div>

<div class="card">🌡 Temp <div class="value" id="temp">0</div></div>
<div class="card">💧 Hum <div class="value" id="hum">0</div></div>
<div class="card">🌱 Soil <div class="value" id="soil">0</div></div>
<div class="card">☀ Light <div class="value" id="light">0</div></div>

<!-- ===== TOGGLE BUTTON ===== -->
<button id="waterBtn" class="btn off" onclick="toggle('water')">💧 WATER OFF</button>
<button id="lightBtn" class="btn off" onclick="toggle('light')">💡 LIGHT OFF</button>
<button id="fanBtn" class="btn off" onclick="toggle('fan')">🌬 FAN OFF</button>

<script>

const server = "http://192.168.1.25";

// สถานะปุ่ม
let state = {
  water: 0,
  light: 0,
  fan: 0
};

// ===== โหลดข้อมูล =====
function loadData(){
  fetch(server + "/data")
  .then(r => r.json())
  .then(d => {
    document.getElementById("temp").innerText = d.temp;
    document.getElementById("hum").innerText = d.hum;
    document.getElementById("soil").innerText = d.soil;
    document.getElementById("light").innerText = d.light;
  });
}

// ===== Toggle =====
function toggle(type){

  state[type] = state[type] ? 0 : 1;

  fetch(server + "/cmd?c=" + type + state[type]);

  let btn = document.getElementById(type + "Btn");

  if(state[type] == 1){
    btn.className = "btn on";
    btn.innerText = "✔ " + type.toUpperCase() + " ON";
  }else{
    btn.className = "btn off";
    btn.innerText = "✖ " + type.toUpperCase() + " OFF";
  }
}

setInterval(loadData, 2000);

</script>

</body>
</html>
