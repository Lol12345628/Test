<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FIX CONTROL</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  margin:5px;
  width:140px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.connect{background:#3b82f6;color:white;}
.auto{background:#a855f7;color:white;}

.card{
  margin:10px;
  padding:10px;
  background:#111827;
  display:inline-block;
  width:150px;
}
</style>
</head>

<body>

<h2>🔥 FIX SMART FARM</h2>

<button class="connect" onclick="connectUSB()">Connect</button>
<button class="auto" onclick="auto()">AUTO</button>

<br>

<button id="p" class="off" onclick="toggle('P1')">Pump</button>
<button id="l" class="off" onclick="toggle('L1')">Light</button>
<button id="f" class="off" onclick="toggle('F1')">Fan</button>

<div class="card">🌡 <div id="t">-</div></div>
<div class="card">💧 <div id="h">-</div></div>
<div class="card">🌱 <div id="s">-</div></div>
<div class="card">💡 <div id="lgt">-</div></div>

<script>

let port, writer;

async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  read();
}

async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

let state = {P1:0,L1:0,F1:0};

function toggle(dev){

  state[dev] = state[dev] ? 0 : 1;

  send(dev + "=" + state[dev]);

  document.getElementById(dev.toLowerCase()[0])
    .className = state[dev] ? "on" : "off";
}

function auto(){
  send("AUTO=1");
}

async function read(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      document.getElementById("t").innerText=d[0];
      document.getElementById("h").innerText=d[1];
      document.getElementById("s").innerText=d[2];
      document.getElementById("lgt").innerText=d[3];
    }
  }
}

</script>

</body>
</html>
