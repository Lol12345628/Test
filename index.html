<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button {
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.on { background:#22c55e; }
.off { background:#ef4444; }
.connect { background:#3b82f6; }

canvas {
  background:white;
  border-radius:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<h2>🌱 Smart Farm AI Dashboard</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>
<button onclick="send('auto_on')">🤖 AUTO MODE</button>
<button class="off" onclick="send('pump_off')">Pump OFF</button>

<div id="ai">AI: waiting data...</div>

<canvas id="chart" width="400" height="200"></canvas>

<script>

let port, writer;
let tempData = [];
let soilData = [];
let labels = [];

// ===== CHART =====
const ctx = document.getElementById('chart');
const chart = new Chart(ctx, {
  type:'line',
  data:{
    labels:labels,
    datasets:[
      { label:'Temp', data:tempData, borderColor:'red' },
      { label:'Soil', data:soilData, borderColor:'blue' }
    ]
  }
});

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();

  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== READ ESP32 =====
async function readLoop(){
  const reader = port.readable.getReader();
  let buffer = "";

  while(true){
    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let [t,s] = line.trim().split(",");

      if(!t || !s) continue;

      tempData.push(parseInt(t));
      soilData.push(parseInt(s));

      labels.push("");

      if(tempData.length > 20){
        tempData.shift();
        soilData.shift();
        labels.shift();
      }

      chart.update();

      ai(parseInt(t), parseInt(s));
    }
  }
}

// ===== AI =====
function ai(temp, soil){

  let msg = "AI: Normal 🌿";

  if(soil < 30){
    msg = "AI: Soil dry → Pump ON 💧";
    send("pump_on");
  }

  if(temp > 35){
    msg = "AI: Hot → Cooling 🌬";
  }

  document.getElementById("ai").innerText = msg;
}

</script>

</body>
</html>
