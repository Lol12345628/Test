<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>USB Smart Farm</title>
</head>

<body>

<h2>🌱 USB Smart Farm</h2>

<button onclick="send('pump_on')">Pump ON</button>
<button onclick="send('pump_off')">OFF</button>

<button onclick="send('light_on')">Light ON</button>
<button onclick="send('light_off')">OFF</button>

<button onclick="send('fan_on')">Fan ON</button>
<button onclick="send('fan_off')">OFF</button>

<script>
async function send(cmd){
  await fetch("http://localhost:5000/control", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({cmd})
  });
}
</script>

</body>
</html>
