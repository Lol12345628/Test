<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm WORKING</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.box{
  background:#111827;
  padding:20px;
  margin:10px;
  border-radius:12px;
  display:inline-block;
  width:180px;
}

.value{
  font-size:30px;
  font-weight:bold;
}

button{
  padding:12px;
  background:#3b82f6;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.status{
  margin-top:10px;
  opacity:0.8;
}

</style>
</head>

<body>

<h2>🤖 Smart Farm FIX WORKING</h2>

<button onclick="connectUSB()">🔌 Connect</button>

<div class="status" id="status">not connected</div>

<div class="box">🌡 <div id="t" class="value">--</div></div>
<div class="box">💧 <div id="h" class="value">--</div></div>
<div class="box">🌱 <div id="s" class="value">--</div></div>
<div class="box">💡 <div id="l" class="value">--</div></div>

<script>

let port;
let reader;
let buffer = "";

// ================= CONNECT =================
async function connectUSB(){

  try{

    port = await navigator.serial.requestPort();
    await port.open({ baudRate:115200 });

    document.getElementById("status").innerText = "connected ✔";

    readLoop();

  }catch(e){
    alert("connect failed: " + e);
  }
}

// ================= SAFE READ =================
async function readLoop(){

  const decoder = new TextDecoder();

  reader = port.readable.getReader();

  while(true){

    try{

      const { value, done } = await reader.read();

      if(done) break;

      buffer += decoder.decode(value);

      let lines = buffer.split("\n");
      buffer = lines.pop();

      for(let line of lines){

        line = line.trim();

        // 🔥 กันข้อมูลมั่ว
        if(line.indexOf(",") === -1) continue;

        let d = line.split(",");

        if(d.length < 4) continue;

        let t = parseFloat(d[0]);
        let h = parseFloat(d[1]);
        let s = parseFloat(d[2]);
        let l = parseFloat(d[3]);

        if(isNaN(t) || isNaN(h) || isNaN(s) || isNaN(l))
          continue;

        document.getElementById("t").innerText = t.toFixed(1);
        document.getElementById("h").innerText = h.toFixed(1);
        document.getElementById("s").innerText = s;
        document.getElementById("l").innerText = l.toFixed(0);
      }

    }catch(e){
      console.log("read error", e);
      document.getElementById("status").innerText = "disconnected";
      break;
    }
  }
}

</script>

</body>
</html>
