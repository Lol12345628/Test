<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI Dashboard</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

/* ===== SENSOR GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(2,160px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:18px;
  border-radius:16px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.title{
  font-size:14px;
  color:#94a3b8;
}

.value{
  font-size:26px;
  font-weight:bold;
}

.temp{ color:#f87171; }
.hum{ color:#38bdf8; }
.soil{ color:#22c55e; }
.lux{ color:#facc15; }

/* ===== BUTTON ===== */
button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:150px;
}

.connect{ background:#3b82f6; color:white; }
.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }

/* ===== AI BOX ===== */
.aiBox{
  margin-top:20px;
  padding:12px;
  background:#1e293b;
  border-radius:10px;
  display:inline-block;
  min-width:300px;
}

</style>
</head>

<body>

<h2>🤖 Smart Farm AI Dashboard</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<!-- SENSOR -->
<div class="grid">

  <div class="card">
    <div class="title">🌡 Temperature</div>
    <div id="temp" class="value temp">-</div>
  </div>

  <div class="card">
    <div class="title">💧 Humidity</div>
    <div id="hum" class="value hum">-</div>
  </div>

  <div class="card">
    <div class="title">🌱 Soil</div>
    <div id="soil" class="value soil">-</div>
  </div>

  <div class="card">
    <div class="title">💡 Light</div>
    <div id="lux" class="value lux">-</div>
  </div>

</div>

<!-- CONTROL -->
<div style="margin-top:20px;">

<button id="pumpBtn" class="off" onclick="toggle('pump')">Pump OFF</button>
<button id="lightBtn" class="off" onclick="toggle('light')">Light OFF</button>
<button id="fanBtn" class="off" onclick="toggle('fan')">Fan OFF</button>

</div>

<!-- AI STATUS -->
<div class="aiBox" id="aiText">AI: waiting data...</div>

<script>

let port, writer;

let state = {
  pump:false,
  light:false,
  fan:false
};

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();

  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd + "\n"));
}

// ===== TOGGLE MANUAL =====
async function toggle(dev){

  state[dev] = !state[dev];

  let cmd = dev + (state[dev] ? "_on" : "_off");
  await send(cmd);

  updateUI();
}

// ===== UI UPDATE =====
function updateUI(){

  pumpBtn.innerText = state.pump ? "Pump ON" : "Pump OFF";
  lightBtn.innerText = state.light ? "Light ON" : "Light OFF";
  fanBtn.innerText = state.fan ? "Fan ON" : "Fan OFF";

  pumpBtn.className = state.pump ? "on" : "off";
  lightBtn.className = state.light ? "on" : "off";
  fanBtn.className = state.fan ? "on" : "off";
}

// ===== AI LOGIC =====
function AI(temp, hum, soil, lux){

  let msg = "AI: Normal 🌿";

  // 🌱 soil สำคัญสุด
  if(soil < 30){
    msg = "AI: Soil DRY → Pump ON 💧";
  }

  // 🌡 ร้อน
  else if(temp > 35){
    msg = "AI: Hot → Fan ON 🌬";
  }

  // 💡 แสงน้อย
  else if(lux < 100){
    msg = "AI: Dark → Light ON 💡";
  }

  // 💧 ชื้นเกิน
  else if(hum > 85){
    msg = "AI: Too humid → Fan ON 🌬";
  }

  document.getElementById("aiText").innerText = msg;
}

// ===== READ SENSOR =====
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let d = line.trim().split(",");
      if(d.length !== 4) continue;

      let temp = +d[0];
      let hum  = +d[1];
      let soil = +d[2];
      let lux  = +d[3];

      document.getElementById("temp").innerText = temp.toFixed(1);
      document.getElementById("hum").innerText  = hum.toFixed(1);
      document.getElementById("soil").innerText = soil;
      document.getElementById("lux").innerText  = lux.toFixed(0);

      AI(temp, hum, soil, lux);
    }
  }
}

</script>

</body>
</html>
