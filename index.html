<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 Live Data</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.box{
  display:inline-block;
  background:#111827;
  padding:15px;
  margin:8px;
  border-radius:12px;
  width:160px;
}

.value{
  font-size:22px;
  color:#38bdf8;
}

.connect{
  padding:12px;
  background:#3b82f6;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>🌱 ESP32 LIVE SENSOR</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>

<br><br>

<div class="box">🌡 Temp<br><div id="temp" class="value">-</div></div>
<div class="box">💧 Hum<br><div id="hum" class="value">-</div></div>
<div class="box">🌱 Soil<br><div id="soil" class="value">-</div></div>
<div class="box">💡 Lux<br><div id="lux" class="value">-</div></div>

<div id="ai" style="margin-top:20px;color:#93c5fd;">
AI: waiting data...
</div>

<script>

let port;

// 🔌 connect USB
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });

  readLoop();
}

// 📡 อ่านข้อมูลจาก ESP32
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let data = line.trim().split(",");

      if(data.length < 4) continue;

      let temp = parseFloat(data[0]);
      let hum  = parseFloat(data[1]);
      let soil = parseInt(data[2]);
      let lux  = parseFloat(data[3]);

      document.getElementById("temp").innerText = temp.toFixed(1);
      document.getElementById("hum").innerText  = hum.toFixed(1);
      document.getElementById("soil").innerText = soil;
      document.getElementById("lux").innerText  = lux.toFixed(0);

      ai(temp, hum, soil, lux);
    }
  }
}

// 🤖 AI วิเคราะห์
function ai(temp, hum, soil, lux){

  let msg = "AI: Normal 🌿";

  if(soil < 35){
    msg = "AI: Soil dry → need water 💧";
  }
  else if(temp > 35){
    msg = "AI: Hot → fan ON 🌬";
  }
  else if(lux < 100){
    msg = "AI: Dark → light ON 💡";
  }

  document.getElementById("ai").innerText = msg;
}

</script>

</body>
</html>
