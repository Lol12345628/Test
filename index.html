<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI Full</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.box{
  display:inline-block;
  background:#111827;
  padding:15px;
  margin:8px;
  border-radius:12px;
  width:150px;
}

.value{
  font-size:22px;
  color:#38bdf8;
}

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }
.connect{ background:#3b82f6; color:white; }

.ai{
  margin-top:15px;
  color:#93c5fd;
}
</style>
</head>

<body>

<h2>🌱 Smart Farm AI FULL SYSTEM</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect USB</button>
<button class="on" onclick="send('auto_on')">AUTO ON</button>
<button class="off" onclick="send('auto_off')">AUTO OFF</button>

<br>

<button onclick="send('pump_on')">Pump ON</button>
<button onclick="send('pump_off')">Pump OFF</button>

<button onclick="send('light_on')">Light ON</button>
<button onclick="send('light_off')">Light OFF</button>

<button onclick="send('fan_on')">Fan ON</button>
<button onclick="send('fan_off')">Fan OFF</button>

<br><br>

<div class="box">🌡 Temp<br><div id="temp" class="value">-</div></div>
<div class="box">💧 Hum<br><div id="hum" class="value">-</div></div>
<div class="box">🌱 Soil<br><div id="soil" class="value">-</div></div>
<div class="box">💡 Lux<br><div id="lux" class="value">-</div></div>

<div id="ai" class="ai">AI: waiting...</div>

<script>

let port, writer;

// 🔌 connect
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();

  readLoop();
}

// 📤 send command
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd + "\n"));
}

// 📡 read sensor
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      let d = line.trim().split(",");
      if(d.length < 4) continue;

      let temp = parseFloat(d[0]);
      let hum  = parseFloat(d[1]);
      let soil = parseInt(d[2]);
      let lux  = parseFloat(d[3]);

      tempEl.innerText = temp.toFixed(1);
      humEl.innerText  = hum.toFixed(1);
      soilEl.innerText = soil;
      luxEl.innerText  = lux.toFixed(0);

      ai(temp, hum, soil, lux);
    }
  }
}

// 🤖 AI
function ai(temp, hum, soil, lux){

  let msg = "AI: Normal 🌿";

  if(soil < 35){
    msg = "AI: Soil dry → Pump ON 💧";
  }
  else if(temp > 35){
    msg = "AI: Hot → Fan ON 🌬";
  }
  else if(lux < 100){
    msg = "AI: Dark → Light ON 💡";
  }

  document.getElementById("ai").innerText = msg;
}

</script>

</body>
</html>
