<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm NO FREEZE</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,160px);
  gap:15px;
  justify-content:center;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:18px;
  border-radius:16px;
}

.value{ font-size:26px; }

.temp{ color:#f87171; }
.hum{ color:#38bdf8; }
.soil{ color:#22c55e; }
.lux{ color:#facc15; }

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  width:150px;
  font-weight:bold;
}

.connect{ background:#3b82f6; color:white; }

.aiBox{
  margin-top:10px;
  padding:10px;
  background:#1e293b;
  border-radius:10px;
}

</style>
</head>

<body>

<h2>🤖 Smart Farm NO FREEZE</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect</button>

<div class="grid">
  <div class="card">🌡 <div id="temp">-</div></div>
  <div class="card">💧 <div id="hum">-</div></div>
  <div class="card">🌱 <div id="soil">-</div></div>
  <div class="card">💡 <div id="lux">-</div></div>
</div>

<div class="aiBox" id="status">status: waiting</div>

<script>

let port;
let reader;
let buffer = "";

// ===== THROTTLE UI =====
let latestData = null;
let lastRender = 0;

// ================= CONNECT =================
async function connectUSB(){

  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });

  startRead();
}

// ================= SAFE READ (NO FREEZE) =================
async function startRead(){

  const textDecoder = new TextDecoder();

  reader = port.readable.getReader();

  while(true){

    try{

      const { value, done } = await reader.read();

      if(done) break;

      buffer += textDecoder.decode(value);

      let lines = buffer.split("\n");
      buffer = lines.pop();

      for(let line of lines){

        let d = line.trim().split(",");
        if(d.length !== 4) continue;

        latestData = {
          t:+d[0],
          h:+d[1],
          s:+d[2],
          l:+d[3]
        };
      }

    }catch(e){

      console.log("read error", e);

      // 🔥 reset reader กันค้าง
      try{
        reader.releaseLock();
      }catch{}

      break;
    }
  }
}

// ================= UI LOOP (FIX FREEZE) =================
function renderLoop(){

  requestAnimationFrame(renderLoop);

  if(!latestData) return;

  const now = Date.now();

  // 🔥 throttle 100ms
  if(now - lastRender < 100) return;
  lastRender = now;

  document.getElementById("temp").innerText = latestData.t.toFixed(1);
  document.getElementById("hum").innerText  = latestData.h.toFixed(1);
  document.getElementById("soil").innerText = latestData.s;
  document.getElementById("lux").innerText  = latestData.l.toFixed(0);

  document.getElementById("status").innerText = "LIVE DATA OK";
}

// start UI loop
renderLoop();

</script>

</body>
</html>
