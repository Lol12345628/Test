String html = R"rawliteral(
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Smart Farm PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.header{
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  margin:10px;
  padding:15px;
  border-radius:15px;
}

.value{
  font-size:26px;
  color:#38bdf8;
}

/* TOGGLE BUTTON */
.toggle{
  width:85%;
  padding:18px;
  margin:10px auto;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

/* ON */
.on{
  background:linear-gradient(45deg,#22c55e,#16a34a);
  box-shadow:0 0 15px #22c55e;
  color:white;
}

/* OFF */
.off{
  background:linear-gradient(45deg,#ef4444,#b91c1c);
  box-shadow:0 0 15px #ef4444;
  color:white;
}
</style>
</head>

<body>

<div class="header">🌱 SMART FARM TOGGLE</div>

<div class="card">🌡 TEMP <div class="value" id="t">0</div></div>
<div class="card">💧 HUM <div class="value" id="h">0</div></div>
<div class="card">🌱 SOIL <div class="value" id="s">0</div></div>
<div class="card">☀ LIGHT <div class="value" id="l">0</div></div>

<!-- TOGGLE BUTTONS -->
<button id="waterBtn" class="toggle off" onclick="toggle('water')">💧 WATER OFF</button>
<button id="lightBtn" class="toggle off" onclick="toggle('light')">💡 LIGHT OFF</button>
<button id="fanBtn" class="toggle off" onclick="toggle('fan')">🌬 FAN OFF</button>

<script>

let state = {
  water:0,
  light:0,
  fan:0
};

// ===== SENSOR =====
setInterval(()=>{
  fetch('/data')
  .then(r=>r.json())
  .then(d=>{
    document.getElementById('t').innerText = d.temp;
    document.getElementById('h').innerText = d.hum;
    document.getElementById('s').innerText = d.soil;
    document.getElementById('l').innerText = d.light;
  });
},2000);

// ===== TOGGLE =====
function toggle(type){

  state[type] = state[type] ? 0 : 1;

  fetch('/cmd?c=' + type + state[type]);

  let btn = document.getElementById(type + "Btn");

  if(state[type] == 1){
    btn.className = "toggle on";
    btn.innerText = "✔ " + type.toUpperCase() + " ON";
  }else{
    btn.className = "toggle off";
    btn.innerText = "✖ " + type.toUpperCase() + " OFF";
  }
}

</script>

</body>
</html>
)rawliteral";
