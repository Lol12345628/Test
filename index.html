<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm</title>
</head>

<body>

<h2>SMART FARM DASHBOARD</h2>

<div id="t"></div>
<div id="h"></div>

<button onclick="fetch('/api/control?cmd=water1')">WATER ON</button>
<button onclick="fetch('/api/control?cmd=water0')">WATER OFF</button>

<script>
const API = window.location.origin + "/api";

setInterval(()=>{
 fetch(API+"/sensor")
 .then(r=>r.json())
 .then(d=>{
   document.getElementById("t").innerText=d.temp;
   document.getElementById("h").innerText=d.hum;
 });
},2000);
</script>

</body>
</html>
