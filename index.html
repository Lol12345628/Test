<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Smart Farm</title>

<style>

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  margin:5px;
  width:160px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.connect{background:#3b82f6;color:white;}

.box{
  margin:10px;
  padding:10px;
  background:#111827;
  display:inline-block;
  width:160px;
}

.ai{
  margin-top:10px;
  color:#38bdf8;
}

</style>
</head>

<body>

<h2>🤖 AI Smart Farm CONTROL</h2>

<button class="connect" onclick="connectUSB()">Connect</button>

<br>

<button id="pump" class="off" onclick="send('PUMP_ON')">Pump</button>
<button id="light" class="off" onclick="send('LIGHT_ON')">Light</button>
<button id="fan" class="off" onclick="send('FAN_ON')">Fan</button>

<div class="ai" id="ai">AI: waiting...</div>

<br>

<div class="box">🌡 <div id="t">-</div></div>
<div class="box">💧 <div id="h">-</div></div>
<div class="box">🌱 <div id="s">-</div></div>
<div class="box">💡 <div id="l">-</div></div>

<script>

let port, writer;

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== AI DISPLAY =====
function ai(t,s,l){

  let msg="AI: normal";

  if(s < 30) msg="AI → pump ON (soil dry)";
  else if(t > 35) msg="AI → fan ON (hot)";
  else if(l < 100) msg="AI → light ON (dark)";

  document.getElementById("ai").innerText = msg;
}

// ===== READ =====
async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      let t=+d[0], h=+d[1], s=+d[2], lgt=+d[3];

      document.getElementById("t").innerText=t;
      document.getElementById("h").innerText=h;
      document.getElementById("s").innerText=s;
      document.getElementById("l").innerText=lgt;

      ai(t,s,lgt);
    }
  }
}

</script>

</body>
</html>
