<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Smart Farm Explainable</title>

<style>

body{
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

h2{ margin-top:15px; }

.grid{
  display:grid;
  grid-template-columns:repeat(2,170px);
  gap:12px;
  justify-content:center;
  margin-top:15px;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:15px;
}

.value{
  font-size:28px;
  font-weight:bold;
}

button{
  padding:12px;
  margin:6px;
  width:150px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.connect{background:#3b82f6;color:white;}

.aiBox{
  margin-top:15px;
  color:#38bdf8;
  font-size:16px;
}

.reason{
  margin-top:5px;
  font-size:13px;
  opacity:0.9;
  color:#cbd5e1;
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:20px;
  background:#1e40af;
  font-size:12px;
  margin-top:10px;
}

</style>
</head>

<body>

<h2>🤖 AI Smart Farm (Explainable AI)</h2>

<button class="connect" onclick="connectUSB()">Connect USB</button>

<br>

<button onclick="send('PUMP_ON')">Pump</button>
<button onclick="send('FAN_ON')">Fan</button>
<button onclick="send('LIGHT_ON')">Light</button>

<div class="aiBox" id="ai">AI: waiting sensor...</div>
<div class="reason" id="reason">reason: -</div>

<div class="badge" id="mode">AI MODE: ACTIVE</div>

<div class="grid">

  <div class="card">🌡 Temp <div class="value" id="t">--</div></div>
  <div class="card">💧 Hum <div class="value" id="h">--</div></div>
  <div class="card">🌱 Soil <div class="value" id="s">--</div></div>
  <div class="card">💡 Light <div class="value" id="l">--</div></div>

</div>

<script>

let port, writer;

// ===== CONNECT =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

// ===== SEND =====
async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

// ===== AI EXPLAIN =================
function aiExplain(t,soil,lux){

  let action = "STABLE";
  let reason = "All values normal";

  // 🌱 SOIL
  if(soil < 30){
    action = "PUMP ON";
    reason = "Soil moisture low → plant needs water";
  }
  else if(soil > 60){
    action = "PUMP OFF";
    reason = "Soil moisture enough → stop watering";
  }

  // 🌡 TEMP override
  if(t > 35){
    action = "FAN ON";
    reason = "Temperature high → cooling needed to protect plant";
  }

  // 💡 LIGHT override
  if(lux < 100){
    action = "LIGHT ON";
    reason = "Light too low → growth support needed";
  }

  document.getElementById("ai").innerText = "AI: " + action;
  document.getElementById("reason").innerText = "Reason: " + reason;
}

// ===== READ DATA =====
async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      let t=+d[0];
      let h=+d[1];
      let s=+d[2];
      let lx=+d[3];

      document.getElementById("t").innerText=t.toFixed(1);
      document.getElementById("h").innerText=h.toFixed(1);
      document.getElementById("s").innerText=s;
      document.getElementById("l").innerText=lx;

      aiExplain(t,s,lx);
    }
  }
}

</script>

</body>
</html>
