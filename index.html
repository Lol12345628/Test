<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm AI Control</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  text-align: center;
}

h1 { margin-top: 20px; }

.card {
  background:#111827;
  padding:15px;
  margin:10px;
  border-radius:15px;
  display:inline-block;
  width:200px;
}

button {
  padding:14px;
  margin:6px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  width:140px;
  transition:0.2s;
}

.on {
  background:#22c55e;
  color:white;
}

.off {
  background:#ef4444;
  color:white;
}

.ai {
  margin-top:20px;
  color:#93c5fd;
  font-size:14px;
}
</style>
</head>

<body>

<h1>🌱 Smart Farm AI</h1>

<div class="card">
  🌡 Temp: <span id="temp">32</span><br>
  🌱 Soil: <span id="soil">40</span><br>
</div>

<br>

<h3>Control</h3>

<button id="pumpBtn" class="off" onclick="toggle('pump')">Pump OFF</button>
<button id="lightBtn" class="off" onclick="toggle('light')">Light OFF</button>
<button id="fanBtn" class="off" onclick="toggle('fan')">Fan OFF</button>

<div class="ai" id="aiText">AI: analyzing...</div>

<script>

let port, writer;

let state = {
  pump:false,
  light:false,
  fan:false
};

// ===== CONNECT USB =====
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate: 115200 });
  writer = port.writable.getWriter();
}
connectUSB(); // auto connect popup

// ===== TOGGLE BUTTON =====
async function toggle(device){

  if(!writer){
    alert("ยังไม่ได้ Connect USB");
    return;
  }

  state[device] = !state[device];

  let cmd = device + (state[device] ? "_on" : "_off");

  await writer.write(new TextEncoder().encode(cmd + "\n"));

  updateUI();
  aiAnalyze();
}

// ===== UI COLOR UPDATE =====
function updateUI(){

  pumpBtn.innerText = state.pump ? "Pump ON" : "Pump OFF";
  lightBtn.innerText = state.light ? "Light ON" : "Light OFF";
  fanBtn.innerText = state.fan ? "Fan ON" : "Fan OFF";

  pumpBtn.className = state.pump ? "on" : "off";
  lightBtn.className = state.light ? "on" : "off";
  fanBtn.className = state.fan ? "on" : "off";
}

// ===== AI ANALYSIS =====
function aiAnalyze(){

  let temp = parseInt(document.getElementById("temp").innerText);
  let soil = parseInt(document.getElementById("soil").innerText);

  let msg = "AI: Normal condition 🌿";

  if (soil < 30 && !state.pump) {
    msg = "AI: Soil dry → Recommend Pump ON 💧";
  }
  else if (temp > 35 && !state.fan) {
    msg = "AI: Hot → Recommend Fan ON 🌬";
  }
  else if (state.pump) {
    msg = "AI: Watering active 💧";
  }

  document.getElementById("aiText").innerText = msg;
}

updateUI();
aiAnalyze();

</script>

</body>
</html>
