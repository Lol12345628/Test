<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm FIX SYNC</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:150px;
}

.on{ background:#22c55e; color:white; }
.off{ background:#ef4444; color:white; }
.connect{ background:#3b82f6; color:white; }
</style>
</head>

<body>

<h2>🌱 Smart Farm FIX SYNC</h2>

<button class="connect" onclick="connectUSB()">🔌 Connect</button>

<br><br>

<button id="pumpBtn" class="off" onclick="send('pump_on','pump_off')">Pump</button>
<button id="lightBtn" class="off" onclick="send('light_on','light_off')">Light</button>
<button id="fanBtn" class="off" onclick="send('fan_on','fan_off')">Fan</button>

<br><br>

<div id="data">Waiting...</div>

<script>

let port, writer;

let state = {
  pump:false,
  light:false,
  fan:false
};

// 🔌 connect
async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({ baudRate:115200 });
  writer = port.writable.getWriter();

  readLoop();
}

// 📤 send toggle
async function send(onCmd, offCmd){

  if(!writer) return;

  let cmd;

  // toggle from REAL state
  if(onCmd.includes("pump")){
    cmd = state.pump ? "pump_off" : "pump_on";
  }
  else if(onCmd.includes("light")){
    cmd = state.light ? "light_off" : "light_on";
  }
  else if(onCmd.includes("fan")){
    cmd = state.fan ? "fan_off" : "fan_on";
  }

  await writer.write(new TextEncoder().encode(cmd + "\n"));
}

// 📡 read
async function readLoop(){

  const reader = port.readable.getReader();
  let buffer = "";

  while(true){

    const { value } = await reader.read();
    buffer += new TextDecoder().decode(value);

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for(let line of lines){

      line = line.trim();

      // ===== STATE =====
      if(line.startsWith("STATE:")){
        let s = line.replace("STATE:","").split(",");

        state.pump = s[0] == "1";
        state.light = s[1] == "1";
        state.fan = s[2] == "1";

        updateUI();
      }

      // ===== DATA =====
      if(line.startsWith("DATA:")){
        document.getElementById("data").innerText = line;
      }
    }
  }
}

// 🎨 UI FIX
function updateUI(){

  pumpBtn.className = state.pump ? "on" : "off";
  lightBtn.className = state.light ? "on" : "off";
  fanBtn.className = state.fan ? "on" : "off";

  pumpBtn.innerText = state.pump ? "Pump ON" : "Pump OFF";
  lightBtn.innerText = state.light ? "Light ON" : "Light OFF";
  fanBtn.innerText = state.fan ? "Fan ON" : "Fan OFF";
}

</script>

</body>
</html>
