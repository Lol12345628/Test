<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Farm FIX</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  margin:5px;
  width:140px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.on{background:#22c55e;color:white;}
.off{background:#ef4444;color:white;}
.auto{background:#a855f7;color:white;}
.connect{background:#3b82f6;color:white;}
</style>
</head>

<body>

<h2>🤖 Smart Farm FIXED</h2>

<button class="connect" onclick="connectUSB()">Connect</button>
<button class="auto" onclick="toggleAuto()">AUTO</button>

<br>

<button onclick="send('P1=1')" id="p" class="off">Pump</button>
<button onclick="send('L1=1')" id="l" class="off">Light</button>
<button onclick="send('F1=1')" id="f" class="off">Fan</button>

<br><br>

🌡 <span id="t">-</span><br>
💧 <span id="h">-</span><br>
🌱 <span id="s">-</span><br>
💡 <span id="lgt">-</span>

<script>

let port, writer;
let autoMode = false;

async function connectUSB(){
  port = await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  writer = port.writable.getWriter();
  readLoop();
}

async function send(cmd){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(cmd+"\n"));
}

function toggleAuto(){
  autoMode = !autoMode;
  send("AUTO=" + (autoMode ? 1 : 0));
}

async function readLoop(){

  const r = port.readable.getReader();
  let b="";

  while(true){

    const {value} = await r.read();
    b += new TextDecoder().decode(value);

    let lines = b.split("\n");
    b = lines.pop();

    for(let l of lines){

      let d = l.split(",");
      if(d.length!=4) continue;

      document.getElementById("t").innerText=d[0];
      document.getElementById("h").innerText=d[1];
      document.getElementById("s").innerText=d[2];
      document.getElementById("lgt").innerText=d[3];
    }
  }
}

</script>

</body>
</html>
