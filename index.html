<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 Control</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

h2 {
  margin-top: 30px;
}

button {
  padding: 12px 18px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.on { background: #22c55e; color: white; }
.off { background: #ef4444; color: white; }
</style>
</head>

<body>

<h2>🌱 ESP32 Control Panel</h2>

<!-- PUMP -->
<button class="on" onclick="send('pump_on')">Pump ON</button>
<button class="off" onclick="send('pump_off')">OFF</button>

<br>

<!-- LIGHT -->
<button class="on" onclick="send('light_on')">Light ON</button>
<button class="off" onclick="send('light_off')">OFF</button>

<br>

<!-- FAN -->
<button class="on" onclick="send('fan_on')">Fan ON</button>
<button class="off" onclick="send('fan_off')">OFF</button>

<script>
async function send(cmd){

  try {
    const res = await fetch("http://localhost:5000/control", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ cmd })
    });

    const data = await res.json();
    console.log("sent:", data);

  } catch (err) {
    console.log("error:", err);
    alert("Python Bridge ไม่ทำงาน หรือยังไม่ได้เปิด");
  }
}
</script>

</body>
</html>
